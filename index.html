<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>findora.dev</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>

    <header class="nav-bar">

        <div class="logo">
            <p> 🎓 findora<span>.dev</span></p>
        </div>

        <nav>
            <a href="index.html" class="active">Explore</a>
            <a href="saved.html">Saved</a>
            <a href="about.html">About</a>
        </nav>



    </header>

    <main>

        <section class="hero">
            <h1>Find your next <span>opportunity.</span></h1>
            <p>Discover internships, scholarships, and career opportunities to help you take your next step.</p>
        </section>


        <section class="results">
            <div class="container">

                <form class="search-bar" id="job-search-form">
                    <label class="search-field">
                        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2">
                            <circle cx="11" cy="11" r="7" />
                            <path d="M20 20l-3.5-3.5" />
                        </svg>
                        <input type="text" id="keyword-input" placeholder="Title, organization, or keyword">
                    </label>
                    <span class="divider"></span>
                    <label class="search-field">
                        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2">
                            <path d="M12 21s7-6.2 7-11a7 7 0 10-14 0c0 4.8 7 11 7 11z" />
                            <circle cx="12" cy="10" r="2.5" />
                        </svg>
                        <input type="text" id="location-input" placeholder='City, county, or "remote"'>
                    </label>
                    <button class="search-button" type="submit">Search</button>
                </form>
            </div>
        </section>

        <!-- sample -->
        <section class="remote-jobs-section">
            <h2>Latest Remote Jobs</h2>

            <p id="status-message" role="status" aria-live="polite">
                Loading remote jobs...
            </p>

            <div id="jobs-container"></div>
        </section>

    </main>

    <script type="module" src="./webapp.js"></script>
</body>

</html>
